apiVersion: v1
kind: Service
metadata:
  name: {{ include "container-image-exporter-node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter-node.labels" . | nindent 4 }}
  {{- if or .Values.service.scrapeAnnotations .Values.service.annotations }}
  annotations:
    {{- if .Values.service.scrapeAnnotations }}
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.metricsPort | quote }}
    prometheus.io/path: "/metrics"
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  selector:
    {{- include "container-image-exporter-node.selectorLabels" . | nindent 4 }}
  clusterIP: {{ .Values.service.clusterIP }}
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
      protocol: TCP
