suite: cluster-exporter deployment
templates:
  - templates/deployment.yaml
release:
  name: cie
set:
  image.repository: foo
tests:
  - it: renders a Deployment by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: cie-container-image-exporter-cluster

  - it: uses image.repository and falls back to appVersion for the tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: foo:latest

  - it: honours image.tag override
    set:
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: foo:v1.2.3

  - it: honours image.pullPolicy
    set:
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: fails when image.repository is empty
    set:
      image.repository: ""
    asserts:
      - failedTemplate:
          errorPattern: image.repository

  - it: metricsPort drives the metrics bind address and container port
    set:
      metricsPort: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:9090
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: healthPort drives the health bind address and container port
    set:
      healthPort: 9091
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --health-probe-bind-address=:9091
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 9091
            protocol: TCP

  - it: probes reference named ports
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: health

  - it: k8sKeychain defaults to false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --k8s-keychain=false

  - it: k8sKeychain=true renders the opt-in flag
    set:
      k8sKeychain: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --k8s-keychain=true

  - it: namespaces allowlist becomes repeated flags
    set:
      namespaces:
        - default
        - kube-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=default
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=kube-system

  - it: registryTimeout defaults to 30s
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-timeout=30s

  - it: registryTimeout override propagates
    set:
      registryTimeout: 2m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registry-timeout=2m

  - it: registryPullSecrets become repeated --image-pull-secret flags
    set:
      registryPullSecrets:
        - my-registry
        - other-registry
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --image-pull-secret=my-registry
      - contains:
          path: spec.template.spec.containers[0].args
          content: --image-pull-secret=other-registry

  - it: --install-namespace defaults to the release namespace
    release:
      namespace: my-install-ns
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --install-namespace=my-install-ns

  - it: imagePullSecrets propagate
    set:
      imagePullSecrets:
        - name: my-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-secret

  - it: carries component label on metadata and pod template
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: cluster-exporter
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: cluster-exporter
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: cluster-exporter

  - it: always mounts an emptyDir at /home/nonroot/.ecr for the AWS credential helper
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ecr-cache
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ecr-cache
            mountPath: /home/nonroot/.ecr

  - it: user-provided volumes and volumeMounts compose with the default ecr-cache
    set:
      volumes:
        - name: docker-config
          secret:
            secretName: my-docker-config
      volumeMounts:
        - name: docker-config
          mountPath: /home/nonroot/.docker
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ecr-cache
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: docker-config
            secret:
              secretName: my-docker-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ecr-cache
            mountPath: /home/nonroot/.ecr
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: docker-config
            mountPath: /home/nonroot/.docker
            readOnly: true
