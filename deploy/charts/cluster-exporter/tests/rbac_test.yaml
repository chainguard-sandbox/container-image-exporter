suite: RBAC
release:
  name: cie
set:
  image.repository: foo
tests:
  - it: default renders ClusterRole + ClusterRoleBinding (one each)
    templates:
      - templates/clusterrole.yaml
      - templates/clusterrolebinding.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: rbac.create=false omits both ClusterRole and ClusterRoleBinding
    templates:
      - templates/clusterrole.yaml
      - templates/clusterrolebinding.yaml
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: default ClusterRole does NOT include the secrets/serviceaccounts rule
    template: templates/clusterrole.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets", "serviceaccounts"]
            verbs: ["get", "list"]

  - it: k8sKeychain=true opts into the secrets/serviceaccounts rule
    template: templates/clusterrole.yaml
    set:
      k8sKeychain: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets", "serviceaccounts"]
            verbs: ["get", "list"]

  - it: k8sKeychain=false drops the secrets/serviceaccounts rule
    template: templates/clusterrole.yaml
    set:
      k8sKeychain: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets", "serviceaccounts"]
            verbs: ["get", "list"]

  - it: extraRules are appended to the ClusterRole
    template: templates/clusterrole.yaml
    set:
      rbac.extraRules:
        - apiGroups: ["tekton.dev"]
          resources: ["tasks"]
          verbs: ["get"]
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["tekton.dev"]
            resources: ["tasks"]
            verbs: ["get"]

  - it: schema rejects typos under rbac (additionalProperties=false)
    template: templates/clusterrole.yaml
    values:
      - ./values/rbac_typo.yaml
    asserts:
      - failedTemplate:
          errorPattern: "Additional property extraRule is not allowed"

  - it: ServiceAccount is created by default
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: cie-container-image-exporter-cluster

  - it: ServiceAccount is skipped when disabled
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: ClusterRoleBinding subject points at the ServiceAccount
    template: templates/clusterrolebinding.yaml
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: cie-container-image-exporter-cluster
            namespace: NAMESPACE

  - it: registryPullSecrets Role+RoleBinding are not rendered by default
    template: templates/role.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: registryPullSecrets renders a namespace-scoped Role for Secret list/watch
    template: templates/role.yaml
    set:
      registryPullSecrets:
        - my-registry
        - other-registry
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]

  - it: registryPullSecrets renders a RoleBinding pointing at the ServiceAccount
    template: templates/role.yaml
    set:
      registryPullSecrets:
        - my-registry
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: cie-container-image-exporter-cluster-image-pull-secrets
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: cie-container-image-exporter-cluster
            namespace: NAMESPACE

  - it: registryPullSecrets Role is omitted when rbac.create=false
    template: templates/role.yaml
    set:
      registryPullSecrets:
        - my-registry
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
