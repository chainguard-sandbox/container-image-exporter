{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "container-image-exporter-cluster.fullname" . }}
  labels:
    {{- include "container-image-exporter-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "container-image-exporter-cluster.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "container-image-exporter-cluster.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
