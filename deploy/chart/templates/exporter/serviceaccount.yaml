{{- if and .Values.exporter.enabled .Values.exporter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "container-image-exporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter.exporter.labels" . | nindent 4 }}
  {{- with .Values.exporter.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.exporter.serviceAccount.automount }}
{{- end }}
