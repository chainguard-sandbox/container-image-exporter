{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "container-image-exporter.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: "{{ .Values.tests.curl.image.repository }}:{{ .Values.tests.curl.image.tag }}"
      args: ['{{ include "container-image-exporter.fullname" . }}:{{ range .Values.exporter.service.ports }}{{ if eq .name "health" }}{{ .port }}{{ end }}{{ end }}']
  restartPolicy: Never
{{- end }}
