---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "container-image-exporter.fullname" . }}
  labels:
    {{- include "container-image-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-image-exporter
subjects:
- kind: ServiceAccount
  name: container-image-exporter
  namespace: {{ .Release.Namespace }}