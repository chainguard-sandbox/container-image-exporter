{{- if and .Values.clusterExporter.enabled .Values.clusterExporter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "container-image-exporter.clusterExporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter.clusterExporter.labels" . | nindent 4 }}
  {{- with .Values.clusterExporter.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.clusterExporter.serviceAccount.automount }}
{{- end }}
