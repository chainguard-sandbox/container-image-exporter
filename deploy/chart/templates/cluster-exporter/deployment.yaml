{{- if .Values.clusterExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "container-image-exporter.clusterExporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter.clusterExporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.clusterExporter.replicaCount }}
  selector:
    matchLabels:
      {{- include "container-image-exporter.clusterExporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.clusterExporter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "container-image-exporter.clusterExporter.labels" . | nindent 8 }}
        {{- with .Values.clusterExporter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "container-image-exporter.clusterExporter.serviceAccountName" . }}
      {{- with .Values.clusterExporter.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cluster-exporter
          {{- with .Values.clusterExporter.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - cluster-exporter
            - --metrics-bind-address=:{{ .Values.clusterExporter.metricsPort }}
            - --health-probe-bind-address=:{{ .Values.clusterExporter.healthPort }}
            - --k8s-keychain={{ .Values.clusterExporter.k8sKeychain }}
            - --platform={{ .Values.clusterExporter.platform }}
            - --cache-duration={{ .Values.clusterExporter.cacheDuration }}
            - --registry-concurrency={{ .Values.clusterExporter.registryConcurrency }}
            - --registry-rps={{ .Values.clusterExporter.registryRps }}
            - --registry-timeout={{ .Values.clusterExporter.registryTimeout }}
            # Always set so --image-pull-secret can look up Secrets in the
            # release namespace. Harmless when --image-pull-secret is unset.
            - --install-namespace={{ .Release.Namespace }}
            {{- range .Values.clusterExporter.namespaces }}
            - --namespaces={{ . }}
            {{- end }}
            {{- range .Values.clusterExporter.annotationAllowlist }}
            - --annotation-allowlist={{ . }}
            {{- end }}
            {{- range .Values.clusterExporter.labelAllowlist }}
            - --label-allowlist={{ . }}
            {{- end }}
            {{- range .Values.clusterExporter.imagePullSecrets }}
            - --image-pull-secret={{ . }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.clusterExporter.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.clusterExporter.healthPort }}
              protocol: TCP
          {{- with .Values.clusterExporter.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.clusterExporter.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.clusterExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The ambient AWS ECR credential helper caches short-lived tokens
            # under $HOME/.ecr, which clashes with readOnlyRootFilesystem if we
            # don't mount it as a writable volume.
            - name: ecr-cache
              mountPath: /home/nonroot/.ecr
            {{- with .Values.clusterExporter.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: ecr-cache
          emptyDir: {}
        {{- with .Values.clusterExporter.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.clusterExporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clusterExporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clusterExporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
