{{- if and .Values.clusterExporter.enabled .Values.clusterExporter.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "container-image-exporter.clusterExporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter.clusterExporter.labels" . | nindent 4 }}
    {{- with .Values.clusterExporter.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
  - path: /metrics
    port: metrics
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "container-image-exporter.clusterExporter.selectorLabels" . | nindent 6 }}
{{- end }}
