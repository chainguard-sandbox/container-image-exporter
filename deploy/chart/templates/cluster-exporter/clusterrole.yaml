{{- if and .Values.clusterExporter.enabled .Values.clusterExporter.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "container-image-exporter.clusterExporter.fullname" . }}
  labels:
    {{- include "container-image-exporter.clusterExporter.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
{{- if .Values.clusterExporter.k8sKeychain }}
- apiGroups: [""]
  resources: ["secrets", "serviceaccounts"]
  verbs: ["get", "list"]
{{- end }}
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
{{- with .Values.clusterExporter.rbac.extraRules }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}
