{{- if .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "container-image-exporter.fullname" . }}-dashboard-chainguard-adoption
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "container-image-exporter.labels" . | nindent 4 }}
    {{- toYaml .Values.grafana.dashboards.labels | nindent 4 }}
data:
  chainguard-adoption.json: |-
    {{- .Files.Get "dashboards/chainguard-adoption.json" | nindent 4 }}
{{- end }}
