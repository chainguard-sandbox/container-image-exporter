nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

exporter:
  enabled: true
  replicaCount: 1

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  rbac:
    create: true
    # Additional ClusterRole rules appended to the defaults.
    # Use this to grant the exporter access to CRDs it can auto-discover.
    # Examples for supported CRD groups:
    #
    # extraRules:
    #   - apiGroups: ["tekton.dev"]
    #     resources: ["tasks", "taskruns"]
    #     verbs: ["get", "list", "watch"]
    #   - apiGroups: ["serving.knative.dev"]
    #     resources: ["services", "revisions"]
    #     verbs: ["get", "list", "watch"]
    #   - apiGroups: ["argoproj.io"]
    #     resources: ["workflows", "workflowtemplates", "clusterworkflowtemplates", "cronworkflows"]
    #     verbs: ["get", "list", "watch"]
    extraRules: []

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop:
      - ALL

  serviceMonitor:
    enabled: false

  service:
    type: ClusterIP
    annotations: {}
    ports:
      - name: metrics
        port: 8080
        targetPort: 8080
        protocol: TCP
      - name: health
        port: 8081
        targetPort: 8081
        protocol: TCP

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # To pull images from private registries, mount a docker config secret here.
  # Create the secret first:
  #   kubectl create secret docker-registry my-docker-config \
  #     --docker-server=<registry> \
  #     --docker-username=<user> \
  #     --docker-password=<token>
  # Then reference it below:
  volumes: []
  # - name: docker-config
  #   secret:
  #     secretName: my-docker-config
  #     items:
  #       - key: .dockerconfigjson
  #         path: config.json

  volumeMounts: []
  # - name: docker-config
  #   mountPath: /home/nonroot/.docker
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

nodeExporter:
  enabled: true

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 0
    runAsGroup: 0
    capabilities:
      drop:
      - ALL
      add:
      - SYS_PTRACE

  serviceMonitor:
    enabled: false

  service:
    clusterIP: None
    annotations: {}
    ports:
      - name: metrics
        port: 8080
        targetPort: 8080
        protocol: TCP

  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

  criSocket: /run/containerd/containerd.sock
  procRoot: /host/proc

  tolerations:
    - operator: Exists

  nodeSelector: {}
  affinity: {}

grafana:
  dashboards:
    # Set to true to create ConfigMaps containing the Grafana dashboards.
    # Requires the Grafana sidecar to be configured to watch for the label below.
    # When using kube-prometheus-stack, ensure sidecar.dashboards.searchNamespace
    # includes the namespace this chart is deployed into, or is set to ALL.
    enabled: false
    # Labels applied to each dashboard ConfigMap for Grafana sidecar auto-discovery.
    # Must match sidecar.dashboards.label in your kube-prometheus-stack values.
    labels:
      grafana_dashboard: "1"

tests:
  curl:
    image:
      repository: cgr.dev/chainguard/curl
      tag: latest
