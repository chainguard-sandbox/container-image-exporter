nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

exporter:
  enabled: true
  replicaCount: 1

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  rbac:
    create: true
    # Additional ClusterRole rules appended to the defaults.
    # Use this to grant the exporter access to CRDs it can auto-discover.
    # Examples for supported CRD groups:
    #
    # extraRules:
    #   - apiGroups: ["tekton.dev"]
    #     resources: ["tasks", "taskruns"]
    #     verbs: ["get", "list", "watch"]
    #   - apiGroups: ["serving.knative.dev"]
    #     resources: ["services", "revisions"]
    #     verbs: ["get", "list", "watch"]
    #   - apiGroups: ["argoproj.io"]
    #     resources: ["workflows", "workflowtemplates", "clusterworkflowtemplates", "cronworkflows"]
    #     verbs: ["get", "list", "watch"]
    extraRules: []

  # When true, the exporter uses the pull secrets configured for the target
  # resource as registry credentials. Requires cluster-wide access to Secrets
  # and ServiceAccounts.
  k8sKeychain: false
  platform: linux/amd64
  cacheDuration: 1h
  registryConcurrency: 10
  registryRps: 5
  # Per-image timeout for registry requests. Set to "0" to disable.
  registryTimeout: 30s
  namespaces: []
  annotationAllowlist: []
  labelAllowlist: []

  # Names of Secrets in the release namespace to use as registry
  # credentials.
  #
  # imagePullSecrets:
  #   - my-private-registry
  imagePullSecrets: []

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  serviceMonitor:
    enabled: false
    # Extra labels applied to the ServiceMonitor metadata. kube-prometheus-stack
    # requires a `release: <name>` label by default (matching the Prometheus
    # release) for the ServiceMonitor to be picked up.
    #
    # additionalLabels:
    #   release: prometheus
    additionalLabels: {}

  metricsPort: 8080
  healthPort: 8081

  service:
    type: ClusterIP
    annotations: {}
    # Emit prometheus.io/{scrape,port,path} annotations on the Service. Set to
    # false when scraping exclusively via ServiceMonitor to avoid duplicate
    # scraping from Prometheus instances that honour both mechanisms.
    scrapeAnnotations: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

  # To pull images from private registries, mount a docker config secret here.
  # Create the secret first:
  #   kubectl create secret docker-registry my-docker-config \
  #     --docker-server=<registry> \
  #     --docker-username=<user> \
  #     --docker-password=<token>
  # Then reference it below:
  volumes: []
  # - name: docker-config
  #   secret:
  #     secretName: my-docker-config
  #     items:
  #       - key: .dockerconfigjson
  #         path: config.json

  volumeMounts: []
  # - name: docker-config
  #   mountPath: /home/nonroot/.docker
  #   readOnly: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

nodeExporter:
  enabled: true

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  # Runs as root with SYS_PTRACE so it can read /proc/<pid>/root/etc/os-release
  # of container processes owned by arbitrary UIDs. Accessing a /proc entry of a
  # process owned by a different user requires ptrace_may_access() to succeed,
  # which needs CAP_SYS_PTRACE in the target's user namespace — root alone is
  # not sufficient.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL
      add:
      - SYS_PTRACE

  serviceMonitor:
    enabled: false
    # See exporter.serviceMonitor.additionalLabels above.
    additionalLabels: {}

  metricsPort: 8080

  service:
    clusterIP: None
    annotations: {}
    # See exporter.service.scrapeAnnotations above.
    scrapeAnnotations: true

  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 10

  criSocket: /run/containerd/containerd.sock
  procRoot: /host/proc

  # If true (default), restrict node_image_* metrics to images currently in
  # use by a running container on this node. If false, every image cached by
  # the local CRI runtime is reported — useful for disk/capacity analysis but
  # noisier on nodes that have cycled through many image tags.
  onlyImagesInUse: true

  # OCI image label keys to include in container_image_node_image_labels
  # metrics. Empty (default) emits all labels.
  labelAllowlist: []

  tolerations:
    - operator: Exists

  nodeSelector: {}
  affinity: {}

grafana:
  dashboards:
    # Set to true to create ConfigMaps containing the Grafana dashboards.
    # Requires the Grafana sidecar to be configured to watch for the label below.
    # When using kube-prometheus-stack, ensure sidecar.dashboards.searchNamespace
    # includes the namespace this chart is deployed into, or is set to ALL.
    enabled: false
    # Labels applied to each dashboard ConfigMap for Grafana sidecar auto-discovery.
    # Must match sidecar.dashboards.label in your kube-prometheus-stack values.
    labels:
      grafana_dashboard: "1"

tests:
  curl:
    image:
      repository: cgr.dev/chainguard/curl
      tag: latest
