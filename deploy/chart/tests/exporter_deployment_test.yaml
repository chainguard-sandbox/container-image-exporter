suite: exporter deployment
templates:
  - templates/exporter/deployment.yaml
release:
  name: cie
set:
  image.repository: foo
tests:
  - it: renders a Deployment by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: cie-container-image-exporter

  - it: is omitted when exporter.enabled is false
    set:
      exporter.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses image.repository and falls back to appVersion for the tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: foo:latest

  - it: honours image.tag override
    set:
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: foo:v1.2.3

  - it: honours image.pullPolicy
    set:
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: fails when image.repository is empty
    set:
      image.repository: ""
    asserts:
      - failedTemplate:
          errorPattern: image.repository

  - it: metricsPort drives the metrics bind address and container port
    set:
      exporter.metricsPort: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:9090
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: healthPort drives the health bind address and container port
    set:
      exporter.healthPort: 9091
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --health-probe-bind-address=:9091
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 9091
            protocol: TCP

  - it: probes reference named ports
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: health

  - it: k8sKeychain=false renders the disabling flag
    set:
      exporter.k8sKeychain: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --k8s-keychain=false

  - it: namespaces allowlist becomes repeated flags
    set:
      exporter.namespaces:
        - default
        - kube-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=default
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=kube-system

  - it: imagePullSecrets propagate
    set:
      imagePullSecrets:
        - name: my-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-secret

  - it: carries component label on metadata and pod template
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: exporter
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: exporter
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: exporter
