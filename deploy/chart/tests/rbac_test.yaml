suite: RBAC
release:
  name: cie
set:
  image.repository: foo
tests:
  - it: default renders ClusterRole + ClusterRoleBinding (one each)
    templates:
      - templates/cluster-exporter/clusterrole.yaml
      - templates/cluster-exporter/clusterrolebinding.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: rbac.create=false omits both ClusterRole and ClusterRoleBinding
    templates:
      - templates/cluster-exporter/clusterrole.yaml
      - templates/cluster-exporter/clusterrolebinding.yaml
    set:
      clusterExporter.rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: default ClusterRole does NOT include the secrets/serviceaccounts rule
    template: templates/cluster-exporter/clusterrole.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets", "serviceaccounts"]
            verbs: ["get", "list"]

  - it: k8sKeychain=true opts into the secrets/serviceaccounts rule
    template: templates/cluster-exporter/clusterrole.yaml
    set:
      clusterExporter.k8sKeychain: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets", "serviceaccounts"]
            verbs: ["get", "list"]

  - it: k8sKeychain=false drops the secrets/serviceaccounts rule
    template: templates/cluster-exporter/clusterrole.yaml
    set:
      clusterExporter.k8sKeychain: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets", "serviceaccounts"]
            verbs: ["get", "list"]

  - it: extraRules are appended to the ClusterRole
    template: templates/cluster-exporter/clusterrole.yaml
    set:
      clusterExporter.rbac.extraRules:
        - apiGroups: ["tekton.dev"]
          resources: ["tasks"]
          verbs: ["get"]
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["tekton.dev"]
            resources: ["tasks"]
            verbs: ["get"]

  - it: schema rejects typos under clusterExporter.rbac (additionalProperties=false)
    template: templates/cluster-exporter/clusterrole.yaml
    values:
      - ./values/rbac_typo.yaml
    asserts:
      - failedTemplate:
          errorPattern: "Additional property extraRule is not allowed"

  - it: cluster-exporter ServiceAccount is created by default
    template: templates/cluster-exporter/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: cie-container-image-exporter-cluster-exporter

  - it: cluster-exporter ServiceAccount is skipped when disabled
    template: templates/cluster-exporter/serviceaccount.yaml
    set:
      clusterExporter.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: node-exporter ServiceAccount is skipped when disabled
    template: templates/node-exporter/serviceaccount.yaml
    set:
      nodeExporter.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: ClusterRoleBinding subject points at the cluster-exporter ServiceAccount
    template: templates/cluster-exporter/clusterrolebinding.yaml
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: cie-container-image-exporter-cluster-exporter
            namespace: NAMESPACE
        template: templates/cluster-exporter/clusterrolebinding.yaml

  - it: imagePullSecrets Role+RoleBinding are not rendered by default
    template: templates/cluster-exporter/role.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: imagePullSecrets renders a namespace-scoped Role for Secret list/watch
    template: templates/cluster-exporter/role.yaml
    set:
      clusterExporter.imagePullSecrets:
        - my-registry
        - other-registry
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]

  - it: imagePullSecrets renders a RoleBinding pointing at the cluster-exporter SA
    template: templates/cluster-exporter/role.yaml
    set:
      clusterExporter.imagePullSecrets:
        - my-registry
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: cie-container-image-exporter-cluster-exporter-image-pull-secrets
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: cie-container-image-exporter-cluster-exporter
            namespace: NAMESPACE

  - it: imagePullSecrets Role is omitted when rbac.create=false
    template: templates/cluster-exporter/role.yaml
    set:
      clusterExporter.imagePullSecrets:
        - my-registry
      clusterExporter.rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
