suite: grafana dashboards
templates:
  - templates/dashboards/chainguard-adoption.yaml
  - templates/dashboards/node-exporter.yaml
release:
  name: cie
set:
  image.repository: foo
tests:
  - it: not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: exporter dashboard renders when exporter dashboard is enabled
    set:
      exporter.grafana.dashboards.enabled: true
    template: templates/dashboards/chainguard-adoption.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: node-exporter dashboard is not rendered when only the exporter dashboard is enabled
    set:
      exporter.grafana.dashboards.enabled: true
    template: templates/dashboards/node-exporter.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: node-exporter dashboard renders when node-exporter dashboard is enabled
    set:
      nodeExporter.grafana.dashboards.enabled: true
    template: templates/dashboards/node-exporter.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: exporter dashboard is not rendered when only the node-exporter dashboard is enabled
    set:
      nodeExporter.grafana.dashboards.enabled: true
    template: templates/dashboards/chainguard-adoption.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: exporter ConfigMap carries the default sidecar label
    set:
      exporter.grafana.dashboards.enabled: true
    template: templates/dashboards/chainguard-adoption.yaml
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"

  - it: node-exporter ConfigMap carries the default sidecar label
    set:
      nodeExporter.grafana.dashboards.enabled: true
    template: templates/dashboards/node-exporter.yaml
    asserts:
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"

  - it: custom sidecar label is applied to the exporter dashboard
    set:
      exporter.grafana.dashboards.enabled: true
      exporter.grafana.dashboards.labels:
        grafana_dashboard: "1"
        mycorp-dashboard: "true"
    template: templates/dashboards/chainguard-adoption.yaml
    asserts:
      - equal:
          path: metadata.labels["mycorp-dashboard"]
          value: "true"

  - it: custom sidecar label is applied to the node-exporter dashboard
    set:
      nodeExporter.grafana.dashboards.enabled: true
      nodeExporter.grafana.dashboards.labels:
        grafana_dashboard: "1"
        mycorp-dashboard: "true"
    template: templates/dashboards/node-exporter.yaml
    asserts:
      - equal:
          path: metadata.labels["mycorp-dashboard"]
          value: "true"

  - it: chainguard-adoption ConfigMap embeds the dashboard JSON
    template: templates/dashboards/chainguard-adoption.yaml
    set:
      exporter.grafana.dashboards.enabled: true
    asserts:
      - matchRegex:
          path: data["chainguard-adoption.json"]
          pattern: '"title"'

  - it: node-exporter ConfigMap embeds the dashboard JSON
    template: templates/dashboards/node-exporter.yaml
    set:
      nodeExporter.grafana.dashboards.enabled: true
    asserts:
      - matchRegex:
          path: data["node-exporter-chainguard-adoption.json"]
          pattern: '"title"'
