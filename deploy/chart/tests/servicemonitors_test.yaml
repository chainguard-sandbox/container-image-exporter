suite: servicemonitors
templates:
  - templates/cluster-exporter/servicemonitor.yaml
  - templates/node-exporter/servicemonitor.yaml
release:
  name: cie
set:
  image.repository: foo
tests:
  - it: not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one per component when both are enabled
    set:
      clusterExporter.serviceMonitor.enabled: true
      nodeExporter.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: cluster-exporter ServiceMonitor only
    set:
      clusterExporter.serviceMonitor.enabled: true
    template: templates/cluster-exporter/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: cluster-exporter

  - it: additionalLabels.release renders on the ServiceMonitor metadata
    set:
      clusterExporter.serviceMonitor.enabled: true
      clusterExporter.serviceMonitor.additionalLabels:
        release: prometheus
    template: templates/cluster-exporter/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.labels.release
          value: prometheus
      # Base labels must still be present.
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: cluster-exporter

  - it: node-exporter ServiceMonitor carries component=node-exporter
    set:
      nodeExporter.serviceMonitor.enabled: true
    template: templates/node-exporter/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: node-exporter
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: node-exporter
