# Source: container-image-exporter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-image-exporter
  namespace: container-image-exporter
  labels:
    helm.sh/chart: container-image-exporter-0.1.0
    app.kubernetes.io/name: container-image-exporter
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: container-image-exporter
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        helm.sh/chart: container-image-exporter-0.1.0
        app.kubernetes.io/name: container-image-exporter
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      containers:
        - name: container-image-exporter
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          image: ":1.16.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: docker-config
              mountPath: /home/nonroot/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      
      volumes:
      - name: docker-config
        secret:
          secretName: container-image-exporter-docker-config
---
# Source: container-image-exporter/templates/tests/test-connection.yaml
apiVersion: v1
