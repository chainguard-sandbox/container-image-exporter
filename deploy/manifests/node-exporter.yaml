apiVersion: v1
kind: Namespace
metadata:
  name: container-image-exporter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-image-node-exporter
  namespace: container-image-exporter
  labels:
    app.kubernetes.io/name: container-image-node-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: container-image-node-exporter
  namespace: container-image-exporter
  labels:
    app.kubernetes.io/name: container-image-node-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: container-image-node-exporter
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: container-image-node-exporter
  namespace: container-image-exporter
  labels:
    app.kubernetes.io/name: container-image-node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: container-image-node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-image-node-exporter
    spec:
      serviceAccountName: container-image-node-exporter
      containers:
      - name: node-exporter
        image: IMAGE_REF
        imagePullPolicy: IfNotPresent
        args:
        - node-exporter
        - --metrics-bind-address=:8080
        - --cri-socket=/run/containerd/containerd.sock
        - --proc-root=/host/proc
        ports:
        - containerPort: 8080
          name: metrics
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - SYS_PTRACE
        volumeMounts:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: containerd-sock
          mountPath: /run/containerd
          readOnly: true
      volumes:
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      - name: containerd-sock
        hostPath:
          path: /run/containerd
          type: Directory
      tolerations:
      - operator: Exists
