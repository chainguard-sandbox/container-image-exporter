version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # k8s.io/* and sigs.k8s.io/controller-runtime move in lockstep with the
      # Kubernetes release cycle and frequently require coordinated bumps to
      # stay coherent. Group them into a single PR per week.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/controller-runtime"
          - "sigs.k8s.io/controller-runtime/*"
    commit-message:
      prefix: "chore"
      include: "scope"
