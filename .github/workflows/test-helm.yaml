name: Test Helm

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/chart/**'
      - 'scripts/test-helm-*.sh'
      - 'Makefile'
      - '.github/workflows/test-helm.yaml'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
  pull_request:
    paths:
      - 'deploy/chart/**'
      - 'scripts/test-helm-*.sh'
      - 'Makefile'
      - '.github/workflows/test-helm.yaml'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs to save CI minutes; queue main pushes so each
  # commit gets a full test report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Lint
        run: make test-helm-lint

      - name: Unit tests
        run: make test-helm-unit

      - name: Integration tests
        run: make test-helm-integration
